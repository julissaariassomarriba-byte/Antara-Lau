services:
  - type: web
    name: antara
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: antara-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INVITE_CODE
        sync: false

databases:
  - name: antara-db
    plan: free
